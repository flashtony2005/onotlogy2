name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不传 toolchain 输入 → action 自动读取仓库根 rust-toolchain.toml（固定 nightly-2026-07-17，避免漂移）
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  # 产品化临近：release profile 能抓 debug 抓不到的问题，成本很低（C3 修改）。
  release:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci && npm run build
      - run: cd ui && npm audit --audit-level=high   # high 阻断（C2）；moderate 定期处理

  # E2E 薄冒烟：阶段二（Auth 落地后开启），依赖 /auth/login（C1）。
  # 冒烟锁「启动 → 登录 → 带 token 读 trace」路径，防回归崩。
