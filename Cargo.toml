[package]
name = "openaip-os"
version = "0.6.1"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.7", features = ["ws", "macros"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3"
libsql = "0.9.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }

# V0.7 认证与授权（P0 风险「无认证」）：argon2id 口令哈希 + 不透明会话令牌。
argon2 = "0.5"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
