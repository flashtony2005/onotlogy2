[package]
name = "oaip-knowledge"
version = "0.14.0"
edition = "2024"
description = "OpenAIP-OS knowledge representation and ontology reasoning kernel"

[features]
test-util = []

[dependencies]
oaip-abi = { path = "../oaip-abi" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono.workspace = true
regex = "1"
thiserror = "2"
horned-owl = { version = "1.4", default-features = false }
owl-dl-reasoner = "0.3"
