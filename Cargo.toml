[workspace]
members = ["crates/oaip-abi", "crates/oaip-eval-core", "crates/oaip-kernel", "crates/oaip-mutation-core", "crates/oaip-session", "crates/oaip-storage", "crates/oaip-trace", "crates/oaip-worker-core"]
resolver = "2"

[package]
name = "openaip-os"
version = "0.9.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.7", features = ["ws", "macros"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3"
libsql = "0.9.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
oaip-abi = { path = "crates/oaip-abi" }
oaip-eval-core = { path = "crates/oaip-eval-core" }
oaip-mutation-core = { path = "crates/oaip-mutation-core" }
oaip-storage = { path = "crates/oaip-storage" }
oaip-kernel = { path = "crates/oaip-kernel" }
oaip-session = { path = "crates/oaip-session" }
oaip-trace = { path = "crates/oaip-trace" }
oaip-worker-core = { path = "crates/oaip-worker-core" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process", "signal"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# V0.7 认证与授权（P0 风险「无认证」）：argon2id 口令哈希 + 不透明会话令牌。
# M4：会话令牌入库前做 SHA-256 哈希（DB 泄漏不直接暴露可用令牌）。
argon2 = "0.5"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

[dev-dependencies]
tokio-tungstenite = "0.24"
