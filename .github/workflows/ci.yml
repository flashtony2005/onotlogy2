name: ci

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-17
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: unwrap budget
        run: ./scripts/unwrap-budget.sh

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-targets

      - name: reasoner scale SLA
        run: make reasoner-scale-ci

      - name: Phase 1 golden scenario
        run: make golden

      - name: Phase 3 Docker runtime preflight
        run: |
          set -o pipefail
          {
            docker version
            docker info
            docker compose version
          } 2>&1 | tee target/phase3-docker-preflight.log

      - name: Phase 3 deployment smoke
        run: |
          set -o pipefail
          make ops-smoke 2>&1 | tee target/phase3-ops-smoke.log

      - name: Phase 3 upgrade and rollback rehearsal
        run: |
          set -o pipefail
          OAIP_BASE_REF=HEAD^ \
          OAIP_CANDIDATE_BIN="$PWD/target/release/oaip" \
          make ops-rehearsal 2>&1 | tee target/phase3-upgrade-rollback.log

      - name: Phase 3 container smoke
        run: |
          set -o pipefail
          make container-smoke 2>&1 | tee target/phase3-container-smoke.log

      - name: Phase 3 Compose smoke
        run: |
          set -o pipefail
          make compose-smoke 2>&1 | tee target/phase3-compose-smoke.log

      - name: Phase 3 release manifest
        if: always()
        run: make release-manifest

      - name: Upload Phase 3 deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-deployment-evidence
          path: |
            target/release-manifest.json
            target/phase3-docker-preflight.log
            target/phase3-ops-smoke.log
            target/phase3-upgrade-rollback.log
            target/phase3-container-smoke.log
            target/phase3-compose-smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: coverage (baseline >= 75%)
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --all-targets --fail-under-lines 75

      - name: cargo audit
        # 白名单 = 经 libsql 传递且本地文件库不可达的 advisory（见 docs/07_测试文档/security-baseline.md）
        run: |
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2025-0134

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  dsh-integration:
    needs: rust
    if: github.event_name == 'workflow_dispatch' && vars.OAIP_DSH_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      OAIP_DSH_COMMAND: ${{ secrets.OAIP_DSH_COMMAND }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-17
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Real dsh golden scenario
        run: make golden-external
