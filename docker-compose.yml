services:
  app:
    image: openaip-os:0.14.1
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "${OAIP_HTTP_BIND:-127.0.0.1}:${OAIP_HTTP_PORT:-8080}:8080"
    environment:
      WB_BOOTSTRAP_ADMIN_USER: ${WB_BOOTSTRAP_ADMIN_USER:?set WB_BOOTSTRAP_ADMIN_USER}
      WB_BOOTSTRAP_ADMIN_PWD: ${WB_BOOTSTRAP_ADMIN_PWD:?set WB_BOOTSTRAP_ADMIN_PWD}
    volumes:
      - oaip-data:/var/lib/oaip
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  oaip-data:
