name: ci

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-17
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: unwrap budget
        run: ./scripts/unwrap-budget.sh

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

      - name: coverage (baseline >= 75%)
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --all-targets --fail-under-lines 75

      - name: cargo audit
        # 白名单 = 经 libsql 传递且本地文件库不可达的 advisory（见 docs/07_测试文档/security-baseline.md）
        run: |
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2025-0134

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
